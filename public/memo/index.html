<!DOCTYPE html>
<html lang="zh-CN" data-default-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>备忘录</title>
  <script src="../theme.js"></script>
  <link rel="stylesheet" href="../libs/bootstrap.min.css">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../tool/support-shell.css">
  <link rel="stylesheet" href="./site.css">
</head>
<body>
  <div class="support-shell">
    <header class="support-bar memo-bar">
      <a class="support-brand" href="../tool/index.html" title="返回工具首页">
        <strong>备忘录</strong>
      </a>

      <div class="search-box">
        <label class="visually-hidden" for="memoSearch">搜索备忘录内容</label>
        <input id="memoSearch" type="search" placeholder="搜索备忘录" autocomplete="off" spellcheck="false">
        <span id="searchStatus" class="search-status" role="status" aria-live="polite"></span>
      </div>

      <nav class="support-actions" aria-label="页面操作">
        <a class="support-link" href="../tool/index.html" title="返回工具首页">工具首页</a>
        <button class="support-icon-button" type="button" data-theme-toggle aria-label="切换到暗夜模式" aria-pressed="false" title="切换到暗夜模式">
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.99 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 20.99 12.79Z"></path>
          </svg>
        </button>
        <a class="support-icon-button" href="https://github.com/luckymaomi/watchdog" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
          <svg class="filled-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.61 7.61 0 0 1 8 3.87c.68 0 1.36.09 2 .26 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"></path>
          </svg>
        </a>
        <button class="support-icon-button menu-button d-md-none" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="展开导航" title="备忘录导航">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </nav>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div id="sidebarMenu" class="sidebar-menu collapse d-md-flex flex-column">
          <div id="audienceFilter" class="audience-filter" role="group" aria-label="备忘录分类">
            <button type="button" class="audience-filter-button active" data-audience="all" aria-pressed="true">全部</button>
            <button type="button" class="audience-filter-button" data-audience="human" aria-pressed="false">人类看</button>
            <button type="button" class="audience-filter-button" data-audience="agent" aria-pressed="false">屁眼子</button>
          </div>
          <nav id="memoList" class="nav flex-column gap-1"></nav>
        </div>
      </aside>
      <main class="main-panel">
        <article id="content" class="content">正在加载...</article>
      </main>
    </div>
  </div>

  <script src="../libs/marked.min.js"></script>
  <script src="../libs/bootstrap.bundle.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
