<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体检排班</title>
    <script src="../../../theme.js"></script>
    <link rel="stylesheet" href="../../../libs/bootstrap.min.css">
    <link rel="stylesheet" href="../../../theme.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="page-shell">
    <header class="app-header">
        <a class="back-link" href="../../index.html">返回工具箱</a>
        <div>
            <h1>体检排班</h1>
            <p>北美带队单独安排 · 其他人员一键均衡分配 · 未安排提前量预警</p>
        </div>
    </header>

    <section class="panel control-panel" aria-labelledby="importHeading">
        <div class="section-head">
            <div>
                <h2 id="importHeading">导入体检工作簿</h2>
                <p id="rosterStatus" class="status-line">正在加载默认机组花名册…</p>
            </div>
        </div>
        <div class="control-grid">
            <label class="field-group">
                <span>体检工作簿</span>
                <input id="medicalFile" class="form-control form-control-sm" type="file" accept=".xlsx,.xls">
            </label>
            <label id="candidateField" class="field-group" hidden>
                <span>待排名单</span>
                <select id="candidateSelect" class="form-select form-select-sm"></select>
            </label>
            <label id="monthField" class="field-group" hidden>
                <span>体检月份</span>
                <select id="monthSelect" class="form-select form-select-sm"></select>
            </label>
        </div>
        <details class="advanced-options">
            <summary>高级选项</summary>
            <div class="advanced-content">
                <label class="field-group">
                    <span>替换默认机组花名册</span>
                    <input id="rosterFile" class="form-control form-control-sm" type="file" accept=".xlsx,.xls">
                </label>
                <a href="../../../template/机组花名册.xlsx" download>下载花名册模板</a>
            </div>
        </details>
        <div class="action-row">
            <span id="medicalStatus" class="status-line">等待导入体检工作簿。</span>
            <div>
                <button id="allocateButton" class="btn btn-primary btn-sm" type="button" disabled>一键分配非北美带队</button>
                <button id="exportButton" class="btn btn-outline-secondary btn-sm" type="button" disabled>导出 Excel</button>
            </div>
        </div>
    </section>

    <section id="healthSection" class="panel health-panel" hidden aria-labelledby="healthHeading">
        <div class="section-head">
            <div>
                <h2 id="healthHeading">数据健康检查</h2>
                <p>说明程序如何理解当前花名册、待排名单和体检额度。</p>
            </div>
            <div id="healthCounts" class="health-counts"></div>
        </div>
        <div id="healthList" class="health-list"></div>
    </section>

    <section id="workspace" hidden>
        <div id="summaryStrip" class="summary-strip" aria-label="排班摘要"></div>

        <section class="panel leader-panel" aria-labelledby="leaderHeading">
            <div class="section-head">
                <div>
                    <h2 id="leaderHeading">北美带队名单</h2>
                    <p>所有 RAMA=1 人员集中在这里单独安排；未填写体检日时，按最近可安排日提前 30、15、10 天预警。</p>
                </div>
                <span id="leaderSummary" class="section-summary"></span>
            </div>
            <div class="table-shell">
                <table class="table table-sm align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="select-column">选择</th>
                        <th>姓名</th>
                        <th>员工号</th>
                        <th>技术信息</th>
                        <th>预排体检日</th>
                        <th>距最近可排日</th>
                        <th>安排状态</th>
                    </tr>
                    </thead>
                    <tbody id="leaderTableBody"></tbody>
                </table>
            </div>
        </section>

        <section class="panel allocation-panel" aria-labelledby="allocationHeading">
            <div class="section-head allocation-head">
                <div>
                    <h2 id="allocationHeading">体检日安排</h2>
                    <p>每天优先保留 1 个名额；人数超过第一轮容量后，再启用保留名额。</p>
                </div>
                <div class="move-controls">
                    <span id="selectionCount">已选择 0 人</span>
                    <select id="moveTarget" class="form-select form-select-sm" aria-label="目标体检日"></select>
                    <button id="moveButton" class="btn btn-outline-secondary btn-sm" type="button" disabled>移动所选</button>
                    <button id="unassignButton" class="btn btn-outline-secondary btn-sm" type="button" disabled>移回待分配</button>
                    <button id="clearSelectionButton" class="btn btn-outline-secondary btn-sm" type="button" disabled>清除选择</button>
                </div>
            </div>
            <div id="pendingSection" class="pending-box" hidden>
                <h3>待分配 <span id="pendingCount">0</span></h3>
                <div id="pendingPeople" class="people-grid"></div>
            </div>
            <div id="dayCards" class="day-grid"></div>
        </section>
    </section>
</main>

<script src="../../../libs/xlsx-js-style.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
