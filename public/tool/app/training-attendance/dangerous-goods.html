<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>培训签到表 · 危险品复训</title><script src="../../../theme.js"></script><link rel="stylesheet" href="../../../libs/bootstrap.min.css"><link rel="stylesheet" href="../../../theme.css"><link rel="stylesheet" href="./styles.css"></head>
<body><main class="page-shell"><header class="app-header"><a class="back-link" href="./index.html">返回培训签到表</a><h1>危险品复训</h1><p>一键生成复训所需的 Word 资料，原始模板和排版保留。</p></header><section class="panel"><div class="section-head"><div><h2>培训参数</h2><span id="appStatus" class="status-line">正在加载默认资源...</span></div><button id="exportButton" class="btn btn-primary" type="button" disabled>一键导出整套资料</button></div><div class="form-grid"><label class="field-group"><span>培训教员</span><input id="instructorInput" class="form-control" type="text" data-refresh></label><label class="field-group"><span>培训时间</span><input id="trainingDateInput" class="form-control" type="date" data-refresh></label><label class="field-group"><span>任务模拟日期</span><input id="taskDateInput" class="form-control" type="date" data-refresh></label><label class="field-group"><span>试卷考核日期</span><input id="examDateInput" class="form-control" type="date" data-refresh></label><label class="field-group field-wide"><span>培训地点</span><input id="locationInput" class="form-control" type="text" value="飞行部XXX会议室" data-refresh></label></div><label class="field-group source-field"><span>参训人员姓名文本</span><textarea id="sourceText" class="form-control" rows="6" placeholder="直接粘贴包含姓名的通知、名单或一段文字" data-refresh></textarea></label><details class="advanced-options"><summary>高级选项</summary><label class="field-group advanced-content"><span>替换默认机组花名册</span><input id="rosterFile" class="form-control" type="file" accept=".xlsx,.xls"></label></details></section><section class="panel"><div class="section-head compact-head"><h2>数据健康检查</h2></div><div id="healthList" class="health-list"></div></section><section class="panel"><div class="section-head compact-head"><h2>学员预览</h2><span id="previewSummary" class="section-summary">尚未匹配人员</span></div><div class="table-shell"><table class="table table-sm align-middle mb-0"><thead><tr><th>序号</th><th>员工号</th><th>姓名</th><th>单位</th></tr></thead><tbody id="previewBody"><tr><td colspan="4" class="empty-cell">等待匹配人员</td></tr></tbody></table></div></section></main><script src="../../../libs/xlsx-js-style.min.js"></script><script type="module" src="./dangerous-goods-app.js"></script></body></html>
