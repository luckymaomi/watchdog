<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>培训签到表 · 应急训练</title>
    <script src="../../../theme.js"></script>
    <link rel="stylesheet" href="../../../libs/bootstrap.min.css">
    <link rel="stylesheet" href="../../../theme.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="page-shell">
    <header class="app-header">
        <a class="back-link" href="./index.html">返回培训签到表</a>
        <h1>应急训练签到表</h1>
    </header>
    <section class="panel">
        <div class="section-head">
            <div><h2>培训参数</h2><span id="appStatus" class="status-line" role="status">正在加载默认资源...</span></div>
            <button id="exportButton" class="btn btn-primary" type="button" disabled>导出签到表 Word</button>
        </div>
        <div class="form-grid">
            <label class="field-group"><span>培训类型</span><select id="kindInput" class="form-select" data-refresh><option value="initial">应急初训（1 天）</option><option value="recurrent">应急复训（2 天）</option></select></label>
            <label class="field-group"><span>培训开始日期</span><input id="startDateInput" class="form-control" type="date" data-refresh></label>
            <label class="field-group field-wide"><span>培训地点</span><input id="locationInput" class="form-control" type="text" value="南航产教融合实训基地" data-refresh></label>
        </div>
        <p class="notice-text">初训为当天；复训连续两天，日期例如 2026年07月29日-30日，填写在同一份签到表中。教员签字和学员签名栏留空。</p>
        <p class="notice-title" id="trainingTimePreview" aria-live="polite">请选择培训日期</p>
        <label class="field-group source-field"><span>参训人员姓名文本</span><textarea id="sourceText" class="form-control" rows="6" placeholder="粘贴含姓名的通知或名单，自动匹配员工号并按出现顺序去重" data-refresh></textarea></label>
        <details class="advanced-options"><summary>高级选项</summary><label class="field-group advanced-content"><span>替换默认机组花名册</span><input id="rosterFile" class="form-control" type="file" accept=".xlsx,.xls"></label></details>
    </section>
    <section class="panel"><div class="section-head compact-head"><h2>数据健康检查</h2></div><div id="healthList" class="health-list"></div></section>
    <section class="panel">
        <div class="section-head compact-head"><h2>学员预览</h2><span id="previewSummary" class="section-summary">尚未匹配人员</span></div>
        <div class="table-shell"><table class="table table-sm align-middle mb-0"><thead><tr><th>序号</th><th>员工号</th><th>姓名</th></tr></thead><tbody id="previewBody"><tr><td colspan="3" class="empty-cell">等待匹配人员</td></tr></tbody></table></div>
    </section>
</main>
<script src="../../../libs/xlsx-js-style.min.js"></script>
<script type="module" src="./emergency-app.js"></script>
</body>
</html>
